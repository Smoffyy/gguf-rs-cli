[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/gguf",
    "crates/quant",
    "crates/backend-cpu",
    "crates/backend-cuda",
    "crates/backend-vk",
    "crates/model",
    "crates/tokenizer",
    "crates/sample",
    "crates/runtime",
    "crates/server",
    "crates/cli",
]

[workspace.package]
version     = "3.1.0"
edition     = "2021"
license     = "MIT"
rust-version = "1.80"
repository  = "https://github.com/Smoffyy/gguf-rs"

[workspace.dependencies]
gguf-core       = { path = "crates/core",        version = "3.1.0" }
gguf-format     = { path = "crates/gguf",        version = "3.1.0" }
gguf-quant      = { path = "crates/quant",       version = "3.1.0" }
gguf-backend-cpu  = { path = "crates/backend-cpu",  version = "3.1.0" }
gguf-backend-cuda = { path = "crates/backend-cuda", version = "3.1.0" }
gguf-backend-vk   = { path = "crates/backend-vk",   version = "3.1.0" }
gguf-model      = { path = "crates/model",       version = "3.1.0" }
gguf-tokenizer  = { path = "crates/tokenizer",   version = "3.1.0" }
gguf-sample     = { path = "crates/sample",      version = "3.1.0" }
gguf-runtime    = { path = "crates/runtime",     version = "3.1.0" }
gguf-server     = { path = "crates/server",      version = "3.1.0" }

anyhow      = "1"
half        = "2"
memmap2     = "0.9"
rayon       = "1"
libloading  = "0.8"
ash         = "0.38"
bytemuck    = { version = "1", features = ["derive"] }
clap        = { version = "4", features = ["derive"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "0.8"
tokio       = { version = "1", features = ["full"] }
axum        = "0.7"
tower-http  = { version = "0.5", features = ["cors"] }
uuid        = { version = "1", features = ["v4"] }
futures     = "0.3"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1

