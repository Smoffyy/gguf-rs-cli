[package]
name    = "gguf-server"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
description = "OpenAI-compatible HTTP server for the gguf-rs inference engine"

[dependencies]
anyhow         = { workspace = true }
axum           = { workspace = true }
futures        = { workspace = true }
gguf-runtime   = { workspace = true }
gguf-sample    = { workspace = true }
gguf-tokenizer = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
tokio          = { workspace = true }
toml           = { workspace = true }
tower-http     = { workspace = true }
uuid           = { workspace = true }
gguf-core      = { workspace = true }

[features]
cuda   = ["gguf-runtime/cuda"]
vulkan = ["gguf-runtime/vulkan"]
